[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "investment-orchestrator"
version = "0.1.0"
description = "Manual Step 1 through Step 4 orchestration workflow for investment-system-yu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.uv]
cache-dir = ".uv-cache"
