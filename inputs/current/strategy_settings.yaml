etf_layer_execution_policy:
  purpose: "Separate long-term ETF allocation style from weekday open-order maintenance; keep Daily execution-only while making Weekly responsible for ETF layer suitability and underdeployment review."
  mandate_alignment:
    benchmark: "QQQ"
    benchmark_carrier_priority: true
    base_first_but_alpha_sleeve_allowed: true
    avoid_chronic_underinvestment_for_core_etfs: true
    daily_must_not_make_research_or_budget_decisions: true

  layers:
    benchmark_carrier_core:
      tickers:
        - QQQ
      long_term_best_style: "prioritize_staying_invested; avoid chronic underinvestment; use ladders for execution discipline but not as a reason to leave core exposure persistently under-deployed"
      new_budget_posture: "deploy core exposure more readily than deep value ladders; if QQQ exposure is under-deployed, Weekly must explicitly review whether to reanchor, add budget within cap, or hold with reason"
      execution_style: "shallow_to_moderate_ladder"
      weekly_review_focus:
        - "core exposure adequacy"
        - "open-order budget stuck too far below market"
        - "whether QQQ is under-deployed relative to mandate"
        - "whether hard-cap headroom exists but core benchmark exposure is not being carried"
      daily_maintenance_style: "execution-only same-budget reanchor only when stale; no thesis/ranking/budget change"

    diversified_core_buffer:
      tickers:
        - VOO
        - VTI
        - VT
      long_term_best_style: "steady broad-market buffer; avoid unnecessary overlap; do not let lower-volatility buffer crowd out QQQ or qualified alpha sleeves"
      new_budget_posture: "select at most one same-role buffer per weekly run; cap is not a forced deployment target"
      execution_style: "moderate_ladder"
      weekly_review_focus:
        - "overlap control among VOO/VTI/VT"
        - "buffer role validity"
        - "whether broad-market buffer is crowding out QQQ or alpha sleeve"
      daily_maintenance_style: "conservative reanchor only if ladder stale under daily_execution_drift_policy"

    sector_alpha_tilt:
      tickers:
        - SMH
        - IGV
      long_term_best_style: "controlled active ETF tilt with wider volatility tolerance and clear 12m+ thesis"
      new_budget_posture: "meaningful but capped when 12m+ thesis, incremental exposure, liquidity, event/theme linkage, and compile contract are strong"
      execution_style: "wider_ladder_accepting_sector_volatility"
      weekly_review_focus:
        - "12m+ thesis durability"
        - "incremental exposure versus QQQ/base ETFs"
        - "sector concentration within cap"
        - "whether volatility is normal for role or thesis/event risk has changed"
      daily_maintenance_style: "wider execution tolerance; avoid reacting to normal sector volatility"

    extended_etf_minority_sleeve:
      long_term_best_style: "pre-approved material but capped alpha sleeve; not a QQQ benchmark-anchor replacement and not a short-term event trade"
      new_budget_posture: "meaningful budget allowed after approved static-list, liquidity, linkage, incremental exposure, future theme anchor, LLM model-risk controls, and cap gates"
      execution_style: "widest_ladder_and_cap_constrained"
      weekly_review_focus:
        - "incremental exposure versus QQQ / SMH / IGV / base ETFs"
        - "theme_bucket concentration"
        - "hot-theme risk"
        - "benchmark drift"
        - "single ETF sleeve cap"
        - "same-run escalation limit"
        - "LLM evidence tier and narrative-drift risk"
        - "whether the ETF remains non-levered, non-inverse, liquid, and role-clear"
      daily_maintenance_style: "execution-only; no new activation from Daily"

daily_execution_drift_policy:
  enabled: true
  applies_to: "weekly_approved_open_orders_only"
  purpose: "weekday execution maintenance only; not research, not ranking, not new buy/sell decision"

  source_priority:
    current_open_order_state: "PORTFOLIO_SNAPSHOT.existing_buy_open_orders_summary"
    daily_price: "DAILY_MARKET_DATA_SNAPSHOT"
    weekly_intended_state_reference_only: "ORDER_STATE_EXPORT"
    weekly_compile_contract: "AUDITED_DECISION_PACKET.final_execution_plans / TEMPLATE4_ORDERS"

  role_resolution_priority:
    - "AUDITED_DECISION_PACKET.final_execution_plans role/template context"
    - "AUDITED_DECISION_PACKET.final_buy_side_delta_table order_intent / why"
    - "buy_order_template_map template_id plus ticker universe fallback"
  ticker_role_fallback:
    QQQ: "benchmark_carrier_core"
    VOO: "diversified_core_buffer"
    VTI: "diversified_core_buffer"
    VT: "diversified_core_buffer"
    SMH: "sector_alpha_tilt"
    IGV: "sector_alpha_tilt"
    CIBR: "extended_etf_minority_sleeve"
    GRID: "extended_etf_minority_sleeve"


  calculations_required:
    anchor_drift_pct: "(daily_last_close - anchor_baseline_last_close) / anchor_baseline_last_close * 100"
    distance_to_highest_live_limit_pct: "(highest_live_limit - daily_last_close) / daily_last_close * 100"
    distance_to_lowest_live_limit_pct: "(lowest_live_limit - daily_last_close) / daily_last_close * 100"

  keep_tolerance:
    method: "role_static_pct_or_atr_multiple_more_permissive"
    anchor_drift_abs_pct_static_cap:
      benchmark_carrier_core: 4.0
      diversified_core_buffer: 4.5
      sector_alpha_tilt: 7.0
      extended_etf_minority_sleeve: 8.0
    anchor_drift_atr_multiple_cap:
      benchmark_carrier_core: 2.25
      diversified_core_buffer: 2.5
      sector_alpha_tilt: 2.75
      extended_etf_minority_sleeve: 3.0
    max_negative_distance_to_highest_live_limit_pct:
      benchmark_carrier_core: 5.5
      diversified_core_buffer: 6.0
      sector_alpha_tilt: 9.0
      extended_etf_minority_sleeve: 10.0


  near_edge_monitor_band:
    enabled: true
    action_effect: "operator_notes_only"
    must_not_change_action: true
    must_not_change_reason_code: true
    must_not_trigger_replace_without_threshold_breach: true

    anchor_drift_pct_band:
      benchmark_carrier_core: 0.75
      diversified_core_buffer: 1.0
      sector_alpha_tilt: 1.5
      extended_etf_minority_sleeve: 2.0

    highest_live_limit_distance_pct_band:
      benchmark_carrier_core: 0.75
      diversified_core_buffer: 1.0
      sector_alpha_tilt: 1.5
      extended_etf_minority_sleeve: 2.0

  lowest_live_limit_policy:
    distance_to_lowest_live_limit_pct:
      required_for_evidence: true
      action_threshold_role: "none"
      note: "Lowest live limit is reported as required evidence only and is not a KEEP/REPLACE threshold unless a separate explicit crash-bid stale rule is added."

  repeated_near_edge_policy:
    enabled: true
    lookback_daily_checks: 2
    benchmark_carrier_core_action: "operator_note_for_next_weekly_review"
    action_effect: "operator_notes_only"
    must_not_trigger_replace_without_threshold_breach: true
    must_not_change_budget_or_ranking_or_thesis: true

  action_rules:
    keep_if:
      - "Portfolio Snapshot current row is reconciled with weekly-approved state"
      - "no override event notes require hold/review/cancel"
      - "required live ladder fields are present"
      - "abs(anchor_drift_pct) is within role tolerance"
      - "distance_to_highest_live_limit_pct is not more negative than role max_negative_distance_to_highest_live_limit_pct"
    replace_if:
      - "same ticker only"
      - "same remaining budget only"
      - "weekly thesis / role / event binding preserved"
      - "no ranking change"
      - "no budget increase"
      - "Portfolio Snapshot current row is complete and parseable"
      - "drift/reachability threshold is breached under this policy"
      - "replace can be computed deterministically from existing weekly-approved role/template and current same-budget constraints"
    hold_for_weekly_review_if:
      - "threshold breach appears thesis/event/role-related rather than execution-only"
      - "override event notes indicate possible thesis or event-window issue"
      - "required role/template mapping is ambiguous"
      - "replace would require changing budget, ticker, ranking, thesis, or weekly role"
    data_gap_if:
      - "daily price missing or stale"
      - "anchor_baseline_last_close missing"
      - "anchor_price_asof missing"
      - "live_order_steps_summary or live_order_qtys_summary missing when replacement/reachability judgment is required"
      - "Portfolio Snapshot cannot be reconciled against weekly-approved state"

  evidence_required_in_source_evidence:
    - "Portfolio Snapshot vs weekly-approved state reconciliation conclusion"
    - "daily_last_close and price_asof"
    - "anchor_baseline_last_close and anchor_price_asof"
    - "anchor_drift_pct"
    - "highest_live_limit / lowest_live_limit / live_step_count"
    - "live_order_steps_summary and live_order_qtys_summary copied from Portfolio Snapshot current row"
    - "distance_to_highest_live_limit_pct"
    - "distance_to_lowest_live_limit_pct"
    - "anchor drift tolerance used; must be described as applying only to abs(anchor_drift_pct)"
    - "highest live limit reachability tolerance used; must be described as applying only to distance_to_highest_live_limit_pct"
    - "distance_to_lowest_live_limit_pct evidence-only status when lowest_live_limit_policy.action_threshold_role = none"
    - "near_edge_monitor_band status and whether operator_notes were required"
    - "override_event_notes status"
    - "ORDER_STATE_EXPORT used only as weekly intended state / audit trail, not live broker truth"

max_new_tickers_per_week:
  base_universe_new_tickers_per_week: 0
  extended_etf_sleeve_new_tickers_per_week: 2

extended_etf_constraints:
  sleeve_budget_cap_pct_of_total_open_orders: 0.35
  single_extended_etf_budget_cap_pct_of_total_open_orders: 0.20
  sleeve_budget_posture: "material_but_capped_alpha_sleeve"
  cap_interpretation: "upper_bound_not_target"
  activation_minimum_effective_budget_pct_of_total_open_orders: 0.04

  max_same_theme_extended_etf_count: 1
  max_same_theme_budget_pct_of_total_open_orders: 0.25
  require_distinct_theme_buckets_when_multiple_extended_etfs: true
  require_incremental_exposure_vs_base: true
  prohibit_price_momentum_as_primary_driver: true

  activation_priority_note: "If an approved extended ETF passes activation and has stronger 12m+ alpha upside / incremental exposure than diversified_core_buffer, Strategy A may allocate meaningful material-but-capped budget after preserving QQQ benchmark-anchor role; cap headroom alone must not force allocation."

llm_model_risk_controls:
  enabled: true
  llm_confidence_is_not_signal: true
  require_structured_evidence_for_budget_increase: true
  confidence_adjusted_sizing_enabled: true

  max_budget_multiplier_by_evidence_tier:
    high_evidence: 1.00
    adequate_evidence: 0.75
    weak_or_mixed_evidence: 0.40
    data_gap_or_media_only: 0.00

  require_evidence_tier_for_budget_above_single_etf_15pct: true

  same_run_escalation_limit:
    max_new_extended_etfs_with_budget_increase: 2
    max_total_budget_increase_pct_of_open_orders_per_run: 0.12
    prohibit_new_extended_etf_plus_sell_rotation_same_theme_same_run: true

  theme_expansion_confirmation:
    require_two_run_confirmation_for_new_theme_bucket: true
    first_run_new_theme_budget_cap_pct_of_total_open_orders: 0.08
    second_run_may_use_full_single_etf_cap_if_thesis_persists: true

  output_variability_buffer:
    require_score_gap_for_budget_reallocation: 2
    require_score_gap_for_rotation: 2
    no_rotation_on_one_rank_change_only: true
    require_same_direction_signal_in_research_and_audit: true

  human_approval_required_for:
    - increasing_extended_etf_sleeve_cap
    - increasing_single_extended_etf_cap
    - adding_new_theme_bucket_to_static_list
    - changing_benchmark_anchor
    - allowing_same_theme_multiple_etfs

